name: publish

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Type publish-<tag>, for example publish-v1.0.0rc1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Require an explicitly confirmed version tag
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$CONFIRM_RELEASE" = "publish-$GITHUB_REF_NAME"
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          ref = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          if ref != version:
              raise SystemExit(f'tag_version_mismatch:{ref}!={version}')
          PY
      - name: Install exact dependency and release tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sclite-core==2.0.0"
          python -m pip install "build>=1,<2" "twine>=6,<7"
          python -m pip install -e '.[dev]'
      - name: Run release contract gates
        run: |
          python scripts/validate_public_truth.py
          python scripts/validate_api_stability.py
          python scripts/validate_v1_freeze.py
          python scripts/generate_conformance_corpus.py --check
          python scripts/validate_release_readiness.py
          python scripts/validate_workflow_security.py
          python scripts/validate_v1_security_review.py --require-independent
          python -m pytest -q
      - name: Build and check distributions
        run: |
          rm -rf dist build *.egg-info
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/govengine/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: 'dist/*'
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
