name: publish

on:
  workflow_dispatch:
    inputs:
      confirm_release:
        description: 'Type publish-<tag>, for example publish-v1.0.0rc1'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Require an explicitly confirmed version tag
        env:
          CONFIRM_RELEASE: ${{ inputs.confirm_release }}
        run: |
          test "$GITHUB_REF_TYPE" = "tag"
          test "$CONFIRM_RELEASE" = "publish-$GITHUB_REF_NAME"
          python - <<'PY'
          import os
          import pathlib
          import tomllib
          version = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
          ref = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          if ref != version:
              raise SystemExit(f'tag_version_mismatch:{ref}!={version}')
          PY
      - name: Install exact dependency and release tooling
        run: |
          python -m pip install -r .github/release-build-requirements.txt
          python -m pip install -r .github/release-test-requirements.txt
          python -m pip install "sclite-core==2.0.1"
          python -m pip install --no-build-isolation -e '.[dev]'
      - name: Run release contract gates
        run: |
          python scripts/validate_public_truth.py
          python scripts/validate_release_train_truth.py
          python scripts/validate_api_stability.py
          python scripts/validate_v1_freeze.py
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [[ "$PACKAGE_VERSION" == "1.0.0rc2" ]]; then
            python scripts/validate_rc_window.py \
              --record docs/rc-window/1.0.0rc2.json \
              --expected-version 1.0.0rc2
          elif [[ "$PACKAGE_VERSION" == *rc* ]]; then
            python scripts/validate_rc_window.py
          else
            python scripts/validate_rc_window.py --require-completed
          fi
          python scripts/generate_conformance_corpus.py --check
          python scripts/validate_release_readiness.py
          python scripts/validate_workflow_security.py
          python scripts/validate_v1_security_review.py --require-independent
          python -m pytest -q
      - name: Build reviewed source artifacts
        run: |
          if [[ "$GITHUB_REF_NAME" == "v1.0.0rc2" ]]; then
            SOURCE_COMMIT="$(python scripts/validate_release_record_commit.py --review-commit "$GITHUB_SHA")"
            mkdir -p "$RUNNER_TEMP/rc2-records"
            cp docs/security-review/rc2-external-review.json "$RUNNER_TEMP/rc2-records/review.json"
            cp docs/rc-window/1.0.0rc2.json "$RUNNER_TEMP/rc2-records/window.json"
            git checkout --detach "$SOURCE_COMMIT"
            echo "$SOURCE_COMMIT" > "$RUNNER_TEMP/reviewed-source-commit"
          fi
          PYTHON=python bash scripts/build_release_artifacts.sh --outdir dist
          mkdir -p "$RUNNER_TEMP/reviewed-dist"
          cp dist/*.whl dist/*.tar.gz "$RUNNER_TEMP/reviewed-dist/"
      - name: Require rc2 review binding and exact A/B artifact equality
        run: |
          if [[ "$GITHUB_REF_NAME" != "v1.0.0rc2" ]]; then exit 0; fi
          SOURCE_COMMIT="$(cat "$RUNNER_TEMP/reviewed-source-commit")"
          python scripts/validate_rc2_release_records.py \
            --review "$RUNNER_TEMP/rc2-records/review.json" \
            --window "$RUNNER_TEMP/rc2-records/window.json" \
            --source-commit "$SOURCE_COMMIT" \
            --wheel "$RUNNER_TEMP"/reviewed-dist/*.whl \
            --sdist "$RUNNER_TEMP"/reviewed-dist/*.tar.gz
          git checkout --detach "$GITHUB_SHA"
          PYTHON=python bash scripts/build_release_artifacts.sh --outdir "$RUNNER_TEMP/published-dist"
          python scripts/compare_release_builds.py --reviewed "$RUNNER_TEMP/reviewed-dist" --published "$RUNNER_TEMP/published-dist"
          cp "$RUNNER_TEMP"/published-dist/* dist/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/govengine/
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: distributions
          path: dist
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: 'dist/*'
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
