name: pytest

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sclite-core==2.0.0"
          python -m pip install -e '.[dev]'
      - name: Validate public truth
        run: python scripts/validate_public_truth.py
      - name: Validate API stability inventory
        run: python scripts/validate_api_stability.py
      - name: Validate v1 API and schema freeze
        run: python scripts/validate_v1_freeze.py
      - name: Validate conformance corpus generation
        run: python scripts/generate_conformance_corpus.py --check
      - name: Validate workflow supply-chain security
        run: python scripts/validate_workflow_security.py
      - name: Validate v1 security review record
        run: python scripts/validate_v1_security_review.py
      - name: Validate release-candidate readiness
        run: python scripts/validate_release_readiness.py
      - name: Ruff
        run: python -m ruff check .
      - name: Mypy
        run: python -m mypy govengine
      - name: Mypy stable facade strict
        run: >-
          python -m mypy --strict --disable-error-code=import-untyped
          govengine/v1.py govengine/api.py govengine/approvals.py
          govengine/governance.py govengine/governance_decision.py
          govengine/governance_trace.py govengine/policy
      - name: Test
        run: python -m pytest -q

  edge-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install pinned SCLite edge
        run: |
          python -m pip install --upgrade pip
          python -m pip install "sclite-core @ git+https://github.com/rozmiarD/SCLite.git@2470373c6384c284ab48df7ce763f0938797d155"
          python -m pip install -e '.[dev]'
      - name: Test pinned edge integration
        run: python -m pytest -q

  package-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install source dependency and build tooling
        run: |
          python -m pip install --upgrade pip build twine
          python -m pip install "sclite-core==2.0.0"
      - name: Clean build artifacts
        run: rm -rf dist build *.egg-info
      - name: Build package
        run: python -m build
      - name: Check package metadata
        run: python -m twine check dist/*
      - name: Wheel install smoke
        run: |
          python -m venv /tmp/govengine-wheel-smoke
          /tmp/govengine-wheel-smoke/bin/python -m pip install --upgrade pip
          /tmp/govengine-wheel-smoke/bin/python -m pip install "sclite-core==2.0.0"
          /tmp/govengine-wheel-smoke/bin/python -m pip install dist/*.whl
          /tmp/govengine-wheel-smoke/bin/python -m pip check
          /tmp/govengine-wheel-smoke/bin/python -c "import importlib.metadata as md, govengine; assert md.version('govengine') == govengine.__version__"
          /tmp/govengine-wheel-smoke/bin/python -c "import importlib.resources as ir, json; root=ir.files('govengine'); data=json.loads(root.joinpath('v1_compatibility_manifest.json').read_text()); corpus=json.loads(root.joinpath('conformance/v1/manifest.json').read_text()); assert len(data['facade_exports']) == 40 and corpus['case_count'] == 33"
