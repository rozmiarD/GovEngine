[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "govengine"
version = "0.16.11"
description = "Carrier-agnostic artifact governance and controlled-execution services that consume SCLite contract lifecycle artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Krzysztof Probola" }]
keywords = ["security", "governance", "execution-contracts", "dry-run", "policy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "sclite-core==1.0.9",
]

[project.urls]
Homepage = "https://github.com/rozmiarD/GovEngine"
Repository = "https://github.com/rozmiarD/GovEngine"
Issues = "https://github.com/rozmiarD/GovEngine/issues"
Changelog = "https://github.com/rozmiarD/GovEngine/blob/main/CHANGELOG.md"
Documentation = "https://github.com/rozmiarD/GovEngine#readme"

[project.optional-dependencies]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8,<9",
  "ruff>=0.14,<1",
]

[project.scripts]
govengine-policy = "govengine.policy.cli:main"
govengine-supervisor = "govengine.supervisor_cli:main"

[tool.mypy]
python_version = "3.11"
files = ["govengine"]
check_untyped_defs = true
disallow_incomplete_defs = true
disable_error_code = [
  "arg-type",
  "assignment",
  "import-untyped",
  "misc",
  "no-any-return",
  "return-value",
  "type-var",
  "union-attr",
]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = false
warn_unused_ignores = true

[tool.setuptools]
packages = [
  "govengine",
  "govengine.contracts",
  "govengine.execution",
  "govengine.policy",
  "govengine.policy.compiler",
  "govengine.policy.model",
  "govengine.policy.runtime",
]

[tool.setuptools.package-data]
govengine = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
