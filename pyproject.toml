[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "govengine"
version = "1.0.0rc2"
description = "In-process Python governance kernel for deterministic policy, approval, scope, and capability decisions."
readme = "PYPI_LONG_DESCRIPTION.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Krzysztof Probola" }]
keywords = ["security", "governance", "execution-contracts", "dry-run", "policy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "sclite-core==2.0.1",
]

[project.urls]
Homepage = "https://github.com/rozmiarD/GovEngine"
Repository = "https://github.com/rozmiarD/GovEngine"
Issues = "https://github.com/rozmiarD/GovEngine/issues"
Changelog = "https://github.com/rozmiarD/GovEngine/blob/main/CHANGELOG.md"
Documentation = "https://github.com/rozmiarD/GovEngine#readme"

[project.optional-dependencies]
dev = [
  "hypothesis==6.156.6",
  "jsonschema==4.26.0",
  "mypy==1.20.2",
  "pytest==8.4.2",
  "pytest-cov==6.3.0",
  "ruff==0.15.20",
  "types-jsonschema==4.26.0.20260518",
]

[project.scripts]
govengine-policy = "govengine.policy.cli:main"
govengine-supervisor = "govengine.supervisor_cli:main"

[tool.mypy]
python_version = "3.11"
files = ["govengine"]
check_untyped_defs = true
disallow_incomplete_defs = true
disable_error_code = [
  "arg-type",
  "assignment",
  "import-untyped",
  "misc",
  "no-any-return",
  "return-value",
  "type-var",
  "union-attr",
]
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = false
warn_unused_ignores = true

[tool.setuptools]
packages = [
  "govengine",
  "govengine.conformance",
  "govengine.conformance.v1",
  "govengine.conformance.v1.invalid",
  "govengine.conformance.v1.valid",
  "govengine.execution",
  "govengine.policy",
  "govengine.policy.compiler",
  "govengine.policy.model",
  "govengine.policy.runtime",
]

[tool.setuptools.package-data]
govengine = [
  "py.typed",
  "v1_compatibility_manifest.json",
]
"govengine.conformance.v1" = ["*.json"]
"govengine.conformance.v1.valid" = ["*.json"]
"govengine.conformance.v1.invalid" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
