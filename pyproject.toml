[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "govengine"
version = "0.10.2a0"
description = "Carrier-agnostic artifact governance and controlled-execution services that consume SCLite contract lifecycle artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Krzysztof Probola" }]
keywords = ["security", "governance", "execution-contracts", "dry-run", "policy"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
  "PyYAML>=6,<7",
  "sclite-core>=0.7.0a0,<0.8",
]

[project.urls]
Homepage = "https://github.com/rozmiarD/GovEngine"
Repository = "https://github.com/rozmiarD/GovEngine"
Issues = "https://github.com/rozmiarD/GovEngine/issues"
Changelog = "https://github.com/rozmiarD/GovEngine/blob/main/CHANGELOG.md"
Documentation = "https://github.com/rozmiarD/GovEngine#readme"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
packages = ["govengine", "govengine.contracts", "govengine.execution", "govengine.policy"]

[tool.setuptools.package-data]
govengine = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
