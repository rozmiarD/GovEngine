[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "govengine"
version = "0.1.1"
description = "Carrier-agnostic governed execution services that consume SCLite contract lifecycle artifacts for policy-gated security automation."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Krzysztof Probola" }]
keywords = ["security", "governance", "execution-contracts", "dry-run", "policy"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = [
  "PyYAML>=6,<7",
  "sclite-core>=0.2.1,<0.3",
]

[project.urls]
Homepage = "https://github.com/rozmiarD/GovEngine"
Repository = "https://github.com/rozmiarD/GovEngine"
Issues = "https://github.com/rozmiarD/GovEngine/issues"
Documentation = "https://github.com/rozmiarD/GovEngine#readme"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[tool.setuptools]
packages = ["govengine", "govengine.contracts", "govengine.execution", "govengine.policy"]

[tool.setuptools.package-data]
govengine = ["*.yaml"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
